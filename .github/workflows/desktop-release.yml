name: Desktop app builds

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows EXE
            os: windows-latest
            script: dist:win
            artifact: "release/*.exe"
            upload-name: TofuPass-Windows
          - name: macOS DMG
            os: macos-latest
            script: dist:mac
            artifact: "release/*.dmg"
            upload-name: TofuPass-macOS
          - name: Linux AppImage
            os: ubuntu-latest
            script: dist:linux
            artifact: "release/*.AppImage"
            upload-name: TofuPass-Linux

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build desktop installer
        run: npm run ${{ matrix.script }} -- --publish never

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.upload-name }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error

  release:
    name: Publish tagged release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    steps:
      - name: Download installer artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/**/*
